[project]
name = "Back-End-8"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "mateusLimadeMacedo", email = "mateuslimamacedo2008@gmail.com"},
    {name = "renan1811", email = "erickechaves@gmail.com"},
    {name = "erickChavesFiamoncini", email = "erickechaves@gmail.com"},
    {name = "", email = ""},
    {name = "renan1811", email = "rennlima477@gmail.com"},
]
dependencies = [
    "djangorestframework>=3.16.1",
    "python-dotenv>=1.1.1",
    "netifaces>=0.11.0",
    "django-filter>=25.1",
    "Pillow>=11.3.0",
    "python-magic>=0.4.27; sys_platform == \"linux\"",
    "django-cors-headers>=4.7.0",
    "djangorestframework-simplejwt>=5.5.1",
    "django-allauth>=65.11.1",
    "requests>=2.32.5",
    "cryptography>=45.0.7",
    "dj-rest-auth[with_social]>=7.0.1",
    "django-cleanup>=9.0.0",
    "django-cloudinary-storage>=0.3.0",
    "django-channels>=0.7.0",
    "django-browser-reload>=1.19.0",
    "shortuuid>=1.0.13",
    "whitenoise>=6.10.0",
    "django-extensions>=4.1",
    "django>=5.2.6",
    "channels-redis>=4.3.0",
    "pyjwt>=2.10.1",
    "views>=0.3",
    "daphne>=4.2.1",
    "channels==4.3.0",
]
requires-python = "==3.10.*"
readme = "README.md"
license = {text = "MIT"}


[tool.pdm]
distribution = false

[tool.pdm.scripts]
dev = "python manage.py runserver"
makemigrations = "python manage.py makemigrations"
migrate = "python manage.py migrate"
user = "python manage.py createsuperuser"
